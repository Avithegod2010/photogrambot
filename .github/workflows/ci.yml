name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, audit, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Audit (fail on critical only)
        # Unpatched advisories exist upstream (braces, node-forge,
        # decode-uri-component); gate on critical so CI stays meaningful.
        run: npm audit --audit-level=critical

      - name: Bundle (Metro)
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export"

      - name: Check for expo dependency drift
        run: npx expo install --check
