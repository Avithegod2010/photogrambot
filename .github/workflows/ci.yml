name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, audit, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # Node 24 strips TypeScript types natively, which the test suite uses
          # to import src/lib modules directly.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Audit (fail on critical only)
        # Unpatched advisories exist upstream (braces, node-forge,
        # decode-uri-component); gate on critical so CI stays meaningful.
        run: npm audit --audit-level=critical

      - name: Bundle (Metro)
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export"

      - name: Check for expo dependency drift
        run: npx expo install --check
