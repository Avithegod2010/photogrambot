name: Release APK

# Builds a production APK with EAS, downloads it, and publishes a GitHub
# Release (APK + latest.json) for the in-app updater.
#
# Required repository secret: EXPO_TOKEN (Expo account token).
# Trigger: push a tag like v1.2.0, or run manually with a tag name.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_SKIP_AUTO_FINGERPRINT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Build production APK
        id: build
        run: |
          # The preview profile builds an APK; production builds an AAB for Play.
          eas build --platform android --profile preview --non-interactive --wait --json > eas-build.json
          node -e "
            const data = require('./eas-build.json');
            const build = Array.isArray(data) ? data[0] : data;
            const url = build?.artifacts?.applicationArchiveUrl || build?.artifacts?.buildUrl;
            if (!url) { console.error('No APK artifact URL in EAS output'); process.exit(1); }
            console.log('artifact=' + url);
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'artifact=' + url + '\n');
          "

      - name: Download APK
        run: curl -L --fail --retry 3 -o photogrambot-release.apk "${{ steps.build.outputs.artifact }}"

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          node scripts/publish-release.mjs \
            --apk photogrambot-release.apk \
            --tag "$TAG" \
            --title "PhotogramBot $TAG" \
            --notes-file CHANGELOG.md
