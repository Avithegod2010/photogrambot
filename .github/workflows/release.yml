name: Release APK

# Builds the APK on GitHub's runners with Gradle — no EAS quota, no Expo token.
#
# Why this exists: the EAS cloud quota is exhausted and local builds on the
# 8 GB dev box take ~1 h plus a long list of environment traps (see
# docs/RELEASE.md §3). The runner has 7 GB RAM, a real Android SDK/NDK and is
# not interrupted, so this is the reliable path.
#
# Signing: android/app/debug.keystore is committed, and
# android/pb-release-signing.properties is gitignored, so a release build here
# falls back to the debug key — the SAME identity the installed app already
# uses. That means the artifact installs with `adb install -r` over an existing
# install, preserving the SQLite index and SecureStore.
#
# Triggers:
#   - manual dispatch: builds an APK artifact (and publishes a release if you
#     supply a tag)
#   - pushing a tag like v1.4.2: builds and publishes the GitHub Release
#
# Required secret: none. GITHUB_TOKEN is provided automatically.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish as a GitHub release with this tag (leave empty to only build)"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Read version
        id: ver
        run: |
          set -euo pipefail
          name=$(grep -E '^versionName=' android/version.properties | cut -d= -f2)
          code=$(grep -E '^versionCode=' android/version.properties | cut -d= -f2)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building $name ($code)"

      - name: Build release APK
        working-directory: android
        # lintVital is the heaviest task in assembleRelease and adds nothing to a
        # shippable APK here; R8/resource shrinking are off for build speed, which
        # matches the local recipe in docs/RELEASE.md.
        run: |
          ./gradlew :app:assembleRelease \
            -x lintVitalRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=false \
            -Pkotlin.compiler.execution.strategy=in-process \
            --no-daemon --max-workers=4 --console=plain

      - name: Stage APK
        run: |
          set -euo pipefail
          src=android/app/build/outputs/apk/release/app-release.apk
          test -f "$src" || { echo "APK not produced"; exit 1; }
          cp "$src" "photogrambot-${{ steps.ver.outputs.name }}.apk"
          ls -lh photogrambot-*.apk

      - name: Verify signer and package
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs photogrambot-*.apk | grep -E "SHA-256|Signer #1 certificate DN"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump badging photogrambot-*.apk | head -1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: photogrambot-${{ steps.ver.outputs.name }}
          path: photogrambot-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          APK_FILE: photogrambot-${{ steps.ver.outputs.name }}.apk
        run: |
          set -euo pipefail
          node scripts/publish-release.mjs \
            --apk "$APK_FILE" \
            --tag "$TAG" \
            --title "PhotogramBot ${{ steps.ver.outputs.name }}" \
            --notes-file CHANGELOG.md \
            --prerelease
