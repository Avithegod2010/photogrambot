version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Most advisories currently resolve only through an Expo SDK 58 upgrade,
    # which is an owner-gated major bump. Dependabot PRs surface those so the
    # migration can be reviewed deliberately rather than auto-merged.
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
