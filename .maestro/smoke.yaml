# Maestro smoke flow for PhotogramBot.
#
# Run against an installed build:
#   maestro test .maestro/smoke.yaml
#
# Assumes app lock is OFF (the flow cannot type a PIN) and a configured
# library. It only navigates read-only screens; it never uploads or deletes.
appId: com.photogrambot.app
---
- launchApp
- assertVisible: "Gallery"

# Local roll -> viewer -> back (skipped on an empty library).
- runFlow:
    when:
      visible:
        id: "local-tile"
    commands:
      - tapOn:
          id: "local-tile"
          index: 0
      - assertVisible: "Back"
      - back
- runFlow:
    when:
      visible:
        id: "photo-tile"
    commands:
      - tapOn:
          id: "photo-tile"
          index: 0
      - assertVisible: "Back"
      - back

# Settings -> appearance -> back.
- tapOn: "Settings"
- assertVisible: "Reconfigure bot"
- scrollUntilVisible:
    element:
      text: "Accent color"
    direction: DOWN
- assertVisible: "Accent color"
- back

# Collections round-trip.
- tapOn: "Collections"
- assertVisible: "Collections"
- tapOn: "Gallery"
- assertVisible: "Gallery"

# Settings -> Remote & sharing (admin allowlist, devices, sync).
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Remote & sharing"
    direction: DOWN
- tapOn: "Remote & sharing"
- assertVisible: "Remote admins"
- assertVisible: "Devices"
- back
- back
- assertVisible: "Gallery"
